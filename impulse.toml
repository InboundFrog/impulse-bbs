# Impulse BBS configuration. Every setting is optional; these are the defaults
# unless noted. Paths are relative to the directory you start impulse in.

bbs_name = "Impulse BBS"
sysop_name = "SysOp"
telnet = true            # false: serial callers only
listen = "0.0.0.0:2323"
max_nodes = 8
# Serial lines (8N1). Only ports listed here are answered.
# [[serial]]
# device = "/dev/ttyUSB0"
# baud = 9600            # 300..115200; a modem's caller rate comes from CONNECT
# rts_cts = false        # hardware flow control (use it with modems)
# modem = false          # true: dial-in modem; answers RING, watches carrier
# init = "ATZ|~ATE0V1Q0S0=0"   # ~ = half-second pause, | = CR; must reply OK
# answer = "ATA"
# hangup = "~~~+++~~~ATH0"     # after dropping DTR
# offhook = "ATH1M0"    # console O: busy out idle modems
# rings = 1              # 2 lets caller ID (NMBR/NAME) arrive before answering
# init_minutes = 30      # re-init after this long without a call, 0 = never

data_path = "data"     # users, messages, logs (created on first run)
menu_path = "menus"    # *.MNU menu files (Impulse text format)
text_path = "text"     # *.ANS / *.ASC display files

start_menu = "MAIN"
closed_system = false
new_user_password = ""   # empty: anyone may sign up
new_sl = 20
new_dsl = 20
new_ar = ""
new_user_order = ["real_name", "city", "phone", "birthday", "sex", "ansi"]  # NUORDER; drop any to skip it
max_logon_tries = 4
unvalidated_logon = false  # false (as 7.1): users at or below new_sl are hung up until validated
phone_pw = false         # also ask the last 4 digits of the phone number
logon_pw_acs = "s255"    # these users also give sysop_password at logon (if set)
slow_baud = 0            # serial callers under this rate are "slow" (0 = off):
slow_lockout = false     #   refuse them (NO9600)
slow_hours = ""          #   or only allow them "HH:MM-HH:MM" (NO9600H / YES9600H)
# Per-SL limits; the entry with the highest min_sl <= the user's SL applies.
# [[sl_limits]]
# min_sl = 20
# calls = 2              # calls a day (0 = no limit; AC flag L = once a day)
# minutes = 45           # minutes a day (0 = minutes_per_day)
# files = 5              # download ratio, files per upload (0 = none)
# kb = 100               # download ratio, K per K uploaded (0 = none)
idle_timeout_minutes = 10
minutes_per_day = 60
sysop_acs = "s255"       # the first user created gets SL 255
global_trap = false      # record every caller's keystrokes to data/trap/trap.msg
auto_chat_capture = false  # record every SysOp chat to data/trap/chat.msg
max_message_lines = 100
cosysop_acs = "s250"     # Co-SysOps: mass mail to all, past full/closed mailboxes
fsop_acs = "s250"        # File SysOps: remove anybody's files
post_acs = ""            # needed to post on any base
mail_acs = ""            # needed to send e-mail
max_posts_per_call = 20  # message SysOps are exempt; 0 = no limit
max_mail_per_call = 20
max_feedback_per_call = 5
max_waiting = 50         # letters a mailbox holds (0 = no limit)
cosysop_max_waiting = 100
max_chat_pages = 3       # OC pages per call, then GOAWAY and a letter instead
max_quote_lines = 50
min_post_space_kb = 100  # refuse to start a message with less free disk

[[boards]]
name = "General"
file = "general"
post_acs = "s20"
# filter = false        # strip colour and 8-bit/control characters from posts

[[boards]]
name = "SysOp Lounge"
file = "sysop"
acs = "s250"

# [strings]  -- prompts, with |XX pipe colour/MCI codes. See src/config.rs.
# enter_handle = "|NL|U1Handle or user number |U2(|U3new|U2)|U1: |U3"
# pause = "|U2[|U3pause|U2]"
