# Impulse BBS configuration. Every setting is optional; these are the defaults
# unless noted. Paths are relative to the directory you start impulse in.

bbs_name = "Impulse BBS"
sysop_name = "SysOp"
telnet = true            # false: serial callers only
listen = "0.0.0.0:2323"
max_nodes = 8
# Serial lines (8N1). Only ports listed here are answered.
# [[serial]]
# device = "/dev/ttyUSB0"
# baud = 9600            # 300..115200; a modem's caller rate comes from CONNECT
# rts_cts = false        # hardware flow control (use it with modems)
# modem = false          # true: dial-in modem; answers RING, watches carrier
# init = "ATZ|~ATE0V1Q0S0=0"   # ~ = half-second pause, | = CR; must reply OK
# answer = "ATA"
# hangup = "~~~+++~~~ATH0"     # after dropping DTR
# offhook = "ATH1M0"    # console O: busy out idle modems
# rings = 1              # 2 lets caller ID (NMBR/NAME) arrive before answering
# init_minutes = 30      # re-init after this long without a call, 0 = never

data_path = "data"     # users, messages, logs (created on first run)
menu_path = "menus"    # *.MNU menu files (Impulse text format)
text_path = "text"     # *.ANS / *.ASC display files

start_menu = "MAIN"
closed_system = false
new_user_password = ""   # empty: anyone may sign up
new_sl = 20
new_dsl = 20
new_ar = ""
new_user_order = ["real_name", "city", "phone", "birthday", "sex", "ansi"]  # NUORDER; drop any to skip it
max_logon_tries = 4
idle_timeout_minutes = 10
minutes_per_day = 60
sysop_acs = "s255"       # the first user created gets SL 255
max_message_lines = 100

[[boards]]
name = "General"
file = "general"
post_acs = "s20"

[[boards]]
name = "SysOp Lounge"
file = "sysop"
acs = "s250"

# [strings]  -- prompts, with |XX pipe colour/MCI codes. See src/config.rs.
# enter_handle = "|NL|U1Handle or user number |U2(|U3new|U2)|U1: |U3"
# pause = "|U2[|U3pause|U2]"
