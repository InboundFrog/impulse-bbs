[package]
name = "impulse"
version = "0.1.0"
edition = "2024"
description = "A Rust re-implementation of the Impulse 7.1 BBS"
license = "MIT"

[dependencies]
argon2 = { version = "0.5", features = ["std"] }
chrono = "0.4"
libc = "0.2.190"
postgres = { version = "0.19.14", features = ["with-chrono-0_4"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
