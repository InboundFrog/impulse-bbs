version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly

  # Workflows pin actions to commit SHAs; this keeps them current.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  # compose.yaml's postgres image.
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
